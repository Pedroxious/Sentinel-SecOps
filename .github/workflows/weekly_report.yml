name: Sentinel SecOps - Weekly Executive Report

on:
  schedule:
    - cron: '0 11 * * 1' # Toda segunda-feira às 11:00 UTC (08:00 Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas requests google-generativeai fpdf2 pillow

      - name: Generate Weekly Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Ensure assets/dashboard_header.png exists
          python -c "
          import os
          from PIL import Image, ImageDraw, ImageFont

          os.makedirs('assets', exist_ok=True)
          banner_path = 'assets/dashboard_header.png'
          if not os.path.exists(banner_path):
              width, height = 1200, 400
              img = Image.new('RGB', (width, height), color=(10, 15, 29))
              draw = ImageDraw.Draw(img)
              for x in range(0, width, 40):
                  draw.line([(x, 0), (x, height)], fill=(16, 26, 48), width=1)
              for y in range(0, height, 40):
                  draw.line([(0, y), (width, y)], fill=(16, 26, 48), width=1)
              points = [
                  (150, 100), (280, 70), (450, 120), (320, 240), (180, 280), (100, 200),
                  (1050, 80), (920, 140), (850, 260), (1000, 310), (1120, 230), (1080, 160)
              ]
              for i in range(len(points)-1):
                  draw.line([points[i], points[i+1]], fill=(14, 165, 233), width=2)
              for pt in points:
                  draw.ellipse([pt[0]-5, pt[1]-5, pt[0]+5, pt[1]+5], fill=(56, 189, 248), outline=(14, 165, 233))
              try:
                  font_large = ImageFont.truetype('DejaVuSans-Bold.ttf', 44)
                  font_sub = ImageFont.truetype('DejaVuSans.ttf', 20)
              except Exception:
                  font_large = ImageFont.load_default()
                  font_sub = ImageFont.load_default()
              draw.text((width//2, 160), 'SENTINEL SECOPS', fill=(255, 255, 255), anchor='mm', font=font_large)
              draw.text((width//2, 220), 'THREAT INTELLIGENCE & CYBER DEFENSE OPERATIONS', fill=(56, 189, 248), anchor='mm', font=font_sub)
              img.save(banner_path)
              print('Generated weekly banner image.')
          "
          # Run PDF generator
          python scripts/output/weekly_pdf_generator.py

      - name: Upload Weekly Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-executive-report
          path: reports/weekly/*.pdf
          if-no-files-found: ignore

      - name: Commit and Push Weekly Report
        run: |
          git config --global user.name  "Sentinel SecOps Bot"
          git config --global user.email "sentinel-bot@users.noreply.github.com"
          git add reports/weekly/
          [ -f "assets/dashboard_header.png" ] && git add assets/dashboard_header.png
          git diff --staged --quiet || git commit -m "Auto-update: Weekly Executive Report $(date '+%Y-W%V')"
          git pull --rebase origin main || true
          git push
